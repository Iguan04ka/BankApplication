spring:

  cache:
    type: redis

  kafka:
    bootstrap-servers: kafka:29092

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: ru.iguana.integrationroles.api.dto.UserWithRolesDto[]
      group-id: saveRoles

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  sql:
    init:
      platform: postgres

  datasource:
    url: jdbc:postgresql://postgres:5432/deal
    username: iguana
    password: postgres
    driverClassName: org.postgresql.Driver

  jpa:
    properties:
      '[hypersistence.utils.enable_types_contributor]': false
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update

  liquibase:
    enabled: false
    change-log: db/changelog/changelog-master.xml

  application:
    name: integration-roles

server:
  port: 8086

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  password-reset:
    ttl-minutes: 30
